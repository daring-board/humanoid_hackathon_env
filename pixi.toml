[workspace]
authors = ["GAI-313 <nakatogawagai@gmail.com>"]
channels = ["conda-forge", "robostack-staging"]
name = "humanoid_hackathon_env"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
verify-sdk = "python -c \"import cyclonedds, numpy, cv2, unitree_sdk2py; from unitree_sdk2py.core.channel import ChannelFactoryInitialize; print('unitree_sdk2py & cyclonedds loaded successfully!')\""
sample-tts = "python samples/sample_tts.py"
sample-walk = "python samples/sample_walk.py"
mock-robot = "python scripts/mock_robot.py"
generate-qrs = "python scripts/generate_test_qrs.py"
scan-qr = "python scripts/qr_scanner.py"
delivery-dryrun = "python scripts/qr_delivery_controller.py --dry-run"
delivery-mock = "python scripts/qr_delivery_controller.py --domain 1"
delivery-real = "python scripts/qr_delivery_controller.py --domain 0 -i Ethernet"
pick-move = "python scripts/pick_move.py"
test-pick-move = "python tests/test_pick_move.py"
dashboard = "python dashboard/run.py"
receiver = "python -m uvicorn receiver:app --app-dir dashboard --host 0.0.0.0 --port 8000"
dashboard-ui = "python -m streamlit run dashboard/app.py --server.port 8501 --server.headless true"
send-dummy = "python dashboard/send_dummy.py"
recognize = "python scripts/recognize.py"
camera-check = "python scripts/camera_check.py"
make-qr = "python scripts/make_qr.py"
test-recognition = "python scripts/test_recognition.py"
control-example = "python scripts/control_example.py"
slides-preview = "python docs/slides/build_preview.py"
qr-survey = "python scripts/qr_survey.py"
gemini-verify = "python scripts/gemini_verify.py"
demo = "python scripts/demo/run_demo.py"
demo-approach = "python scripts/demo/phase0_approach.py"
demo-read-qr = "python scripts/demo/phase1_read_qr.py"
demo-grasp = "python scripts/demo/phase2_grasp.py"
demo-move = "python scripts/demo/phase3_move.py"
demo-release = "python scripts/demo/phase4_release.py"
demo-next-action = "python scripts/demo/next_action.py"
test-demo-handoff = "python tests/test_demo_handoff.py"
test-robot-errors = "python tests/test_robot_errors.py"

[dependencies]
python = "3.10.*"
numpy = ">=1.26"
opencv = ">=4.8"
fastapi = ">=0.141.1,<0.142"
uvicorn = ">=0.52.4,<0.53"
streamlit = ">=1.62.0,<2"
pandas = ">=2.3.3,<3"

[pypi-dependencies]
cyclonedds = "==0.10.2"
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git" }
